<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Threatdle · Who hacked them?</title>
<meta name="description" content="A daily guessing game about real hacking cases. Read the clues, name the hacker group.">
<meta name="theme-color" content="#14130f">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="preload" href="/fonts/special-elite.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/game.css">
<script type="module" src="/js/app.mjs"></script>
</head>
<body>
<header class="top">
  <div class="bar1"><h1 class="brand">Threatdle</h1><p class="tag">Who hacked them?</p></div>
  <div class="modes" id="modes" role="group" aria-label="Mode">
    <button class="mode" data-mode="analyst" aria-pressed="false"><span class="mt">SOC Analyst<i>Easy</i><span class="done"></span></span><span class="md">Guess from the Most Wanted</span></button>
    <button class="mode" data-mode="hunter" aria-pressed="false"><span class="mt">Threat Hunter<i>Hard</i><span class="done"></span></span><span class="md">Name any of <span id="poolN">178</span> groups</span></button>
  </div>
</header>
<main id="board" aria-live="off"><p class="loading">Opening today's case file…</p></main>
<div class="hbar" id="bar" role="region" aria-label="Guess a group" hidden>
  <div class="hbar-in">
    <ul class="ac-list" id="aclist" role="listbox" aria-label="Matching groups" hidden></ul>
    <label class="vh" for="guess">Name a hacker group</label>
    <input id="guess" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="aclist" autocomplete="off" spellcheck="false" placeholder="Group or APT number">
    <button id="browse" class="btn primary" aria-haspopup="dialog">Browse</button>
  </div>
</div>
<dialog id="roster" class="rdlg" aria-labelledby="rosterH">
  <div class="rhead"><h2 id="rosterH"><span id="rosterT">Most Wanted</span> <span id="rosterN"></span></h2><p id="rosterLive" role="status"></p><button id="rosterClose" class="btn ghost sm" aria-label="Close the list">Close</button>
    <div class="rtools"><label class="vh" for="rosterQ">Search the list</label><input id="rosterQ" type="search" autocomplete="off" spellcheck="false" placeholder="Search a name or APT number">
    <button id="showRuled" class="btn ghost sm tog" aria-pressed="false">Show ruled out</button></div></div>
  <div id="rosterBody" class="rbody"></div>
</dialog>
<div id="sr" class="vh" role="status" aria-live="polite"></div>
</body>
</html>
